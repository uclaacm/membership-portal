name: Lint

on:
  # Called by ci.yml; can also be run by hand from the Actions tab.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
